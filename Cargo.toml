[package]
name = "rustyfin"
version = "0.1.0"
edition = "2024"
description = "A Windows Jellyfin player with mpv and native Dolby Vision playback"
repository = "https://github.com/Duplex4773/RustyFin"
license = "MIT"

[dependencies]
accesskit = "0.24.1"
accesskit_windows = { version = "0.34.0", path = "vendor/accesskit_windows" }
anyhow = "1"
async-channel = "2"
base64 = "0.22"
gpui = { version = "0.2.2", default-features = false, features = ["windows-manifest"] }
gpui-component = "=0.5.1"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
libloading = "0.8"
raw-window-handle = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
chrono = "0.4"
sha2 = "0.10"
tempfile = "3"
url = "2"
uuid = { version = "1", features = ["v4"] }
windows-core = "0.61"
windows = { version = "0.61", features = [
    "Graphics", "Win32_Devices_Display", "Media", "Devices_Display_Core", "Foundation_Collections", "Win32_Foundation",
    "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dxgi", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_Media_MediaFoundation",
    "Win32_Security_Credentials", "Win32_System_Com", "Win32_System_Com_StructuredStorage",
    "Win32_System_Console", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_Variant", "Win32_System_WinRT", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_XboxController",
] }
discord-rich-presence = "1.1"
dolby_vision = "3.4.0"
memchr = "2"

[build-dependencies]
embed-resource = "3"

[profile.dev]
debug = 0

# Interactive builds need to lay out and paint a 4K library within a refresh.
[profile.dev.package.gpui]
opt-level = 3
# Use GPUI's precompiled Direct3D shaders in the interactive development build.
debug-assertions = false

[profile.dev.package.taffy]
opt-level = 3

# GPUI Component's inspector must match the GPUI renderer configuration.
[profile.dev.package.gpui-component]
debug-assertions = false

[profile.dev.package.rustyfin]
opt-level = 2
